services:
  - type: web
    name: nexus-api
    runtime: go
    plan: free
    healthCheckPath: /health
    buildCommand: go build -o bin/portal ./cmd/portal && go build -o bin/merchant-mcp ./cmd/merchant-mcp && go build -o bin/aegis-gateway ./cmd/aegis-gateway && chmod +x scripts/start-render.sh
    startCommand: ./scripts/start-render.sh
    envVars:
      - key: GO_VERSION
        value: 1.23.x
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: MCP_INTERNAL_URL
        value: http://localhost:8082
      # Must match the service name above (drives <name>.onrender.com MCP URLs).
      - key: MCP_PUBLIC_BASE_URL
        value: https://nexus-api.onrender.com
      - key: NEXUS_ADMIN_KEY
        sync: false

databases:
  - name: nexus-db
    databaseName: nexus
    plan: free

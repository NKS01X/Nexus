version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegis-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-gateway
    command: ["/usr/local/bin/aegis-gateway", "--config", "/app/config.yaml"]
    ports:
      - "8081:8081"
    environment:
      - DB_PASSWORD=postgres
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./web:/app/web:ro
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/migrate && /usr/local/bin/aegis-gateway --config /app/config.yaml"]

  merchant-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merchant-mcp
    command: ["/usr/local/bin/merchant-mcp", "--config", "/app/config.yaml"]
    ports:
      - "8082:8082"
    environment:
      - DB_PASSWORD=postgres
    depends_on:
      - aegis-gateway
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/migrate && /usr/local/bin/merchant-mcp --config /app/config.yaml"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-dashboard
    command: ["/usr/local/bin/dashboard", "--config", "/app/config.yaml", "--port", "8083"]
    ports:
      - "8083:8083"
    environment:
      - DB_PASSWORD=postgres
    depends_on:
      - aegis-gateway
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./web:/app/web:ro
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/migrate && /usr/local/bin/dashboard --config /app/config.yaml --port 8083"]

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-portal
    command: ["/usr/local/bin/portal", "--config", "/app/config.yaml"]
    ports:
      - "8084:8084"
    environment:
      - DB_PASSWORD=postgres
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      - aegis-gateway
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/migrate && /usr/local/bin/portal --config /app/config.yaml"]

volumes:
  postgres_data: